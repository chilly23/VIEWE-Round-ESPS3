<line x1="40" y1="548" x2="920" y2="548" stroke="#4f5d75" stroke-width="0.7"/>
<text x="40" y="568" font-family="Geist, Arial, sans-serif" font-size="10" fill="#5a6580">One firmware runs at a time. The spectrum demo has an unresolved microphone limitation.</text>
<text x="40" y="588" font-family="Geist Mono, Consolas, monospace" font-size="8" fill="#5a6580">ARROWS: DATA OR DEPENDENCY DIRECTION   /   SOURCE: REPOSITORY FILES</text>
